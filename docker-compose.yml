services:
  postgres:
    image: postgres:16-alpine
    container_name: safety-gate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safety_gate
    ports:
      - "5433:5432"
    volumes:
      - safety_gate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safety_gate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safety-gate-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - safety_gate_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  safety_gate_pgdata:
  safety_gate_redisdata:
